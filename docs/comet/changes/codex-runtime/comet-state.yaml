acceptance:
  - id: A1
    source: brief.md
    text: A1：显式无效 `CODEX_PATH` 不回退，PATH 缺失返回诊断；非 0.148.0 只警告并继续，stdout 不受污染。
    result: passed
    reason:
      text: CODEX_PATH、PATH、版本警告与 stdout 隔离通过。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：ACP initialize 只触发一次 app-server initialize，随后 new/resume/load 可建立隔离
      session。
    result: passed
    reason:
      text: initialize once 及 session 初始化顺序通过。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：同一 session 连续多轮 prompt；early completion、旧 turn completion 与跨 session
      事件不会错误结束当前 prompt。
    result: passed
    reason:
      text: 多轮、early/stale/cross-session completion 通过。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：cancel-before-start 不留下 turn；迟到 turn/start 被标记 stale 并 interrupt；重复取消幂等。
    result: failed
    reason:
      text: cancel-before-start 后 activePrompt 直到 RunTurn 返回才释放，可永久阻塞后续 turn。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：并发 steering 严格 FIFO，无活动 turn 时启动新 turn，单项失败后队列继续且不产生 rival turn。
    result: passed
    reason:
      text: FIFO steering、失败继续与无 rival turn 通过。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：app-server EOF/exit、session close 与 Adapter close 会解除 pending
      request/waiter/queue，无 goroutine 泄漏。
    result: failed
    reason:
      text: CloseSession 无法解除未知 turn ID 阶段的 pending RunTurn/goroutine。
      truncated: false
  - id: A7
    source: brief.md
    text: A7：`go test ./...`、`go test -race ./...`、`go vet ./...` 与目标构建通过。
    result: passed
    reason:
      text: fresh test/race/vet/protocol/build 通过。
      truncated: false
  - id: A8
    source: brief.md
    text: A8：全部手写 Go 类型、字段和函数有中文注释，关键并发逻辑注明固定 codex-acp symbol/test 来源。
    result: failed
    reason:
      text: UPSTREAM.md 未记录 cancel-before-start 实质时序差异。
      truncated: false
  - id: A9
    source: specs/codex-runtime/spec.md
    text: Codex 可执行文件由用户预装；若 `CODEX_PATH` 非空则只使用该显式路径，否则使用 `exec.LookPath` 或等价机制从
      PATH 查找。显式路径无效或 PATH 不存在 Codex 时返回清晰启动错误，不下载或静默回退。
    result: passed
    reason:
      text: 显式路径/PATH 策略正确。
      truncated: false
  - id: A10
    source: specs/codex-runtime/spec.md
    text: 启动前获取 Codex 版本；0.148.0 是已验证基线。其他版本在 stderr/结构化日志输出兼容性警告后继续尝试，stdout 不得出现非
      ACP JSON-RPC 内容。
    result: passed
    reason:
      text: 基线版本探测和兼容警告正确。
      truncated: false
  - id: A11
    source: specs/codex-runtime/spec.md
    text: Codex Adapter 使用解析到的 Codex 启动 `codex app-server` 子进程，只使用 stdin/stdout
      JSON-RPC；V1 不增加 HTTP、WebSocket 或 Unix Socket 传输。
    result: passed
    reason:
      text: 单一 app-server 与 stdin/stdout NDJSON 通过。
      truncated: false
  - id: A12
    source: specs/codex-runtime/spec.md
    text: 启动后执行 app-server initialize，再允许 thread/turn 请求。
    result: passed
    reason:
      text: initialize 完成后才开放 thread/turn。
      truncated: false
  - id: A13
    source: specs/codex-runtime/spec.md
    text: stdout 只承载协议消息；stderr 进入结构化/关联日志，不能污染 JSON-RPC。
    result: failed
    reason:
      text: app-server stderr 仅进入 tailBuffer，正常运行/正常退出不进入结构化 Logger。
      truncated: false
  - id: A14
    source: specs/codex-runtime/spec.md
    text: 子进程退出、stdin/stdout 断开或 Adapter 关闭时，dispose 连接、取消活动请求并向 ACP 返回稳定错误；清理必须幂等。
    result: passed
    reason:
      text: EOF/exit/close fatal fanout 与幂等清理通过。
      truncated: false
  - id: A15
    source: specs/codex-runtime/spec.md
    text: new session 映射到 Codex thread/start，建立 ACP SessionID 与 Codex ThreadID 的内部关系。
    result: passed
    reason:
      text: new session 到 thread/start 映射通过。
      truncated: false
  - id: A16
    source: specs/codex-runtime/spec.md
    text: load/resume 使用固定上游基线的恢复流程，恢复必要历史与配置后才安装 session 状态。
    result: passed
    reason:
      text: resume/read/install 顺序通过。
      truncated: false
  - id: A17
    source: specs/codex-runtime/spec.md
    text: session open/close 使用 generation 或等价身份保护：迟到的 open 结果不能覆盖已关闭或重新打开的 session。
    result: passed
    reason:
      text: generation open/close fence 通过。
      truncated: false
  - id: A18
    source: specs/codex-runtime/spec.md
    text: 一个 session 的失败、关闭或恢复错误不得污染其他 session。
    result: passed
    reason:
      text: session 隔离通过。
      truncated: false
  - id: A19
    source: specs/codex-runtime/spec.md
    text: prompt 将 Text/Image/Resource 转换后的输入提交到 turn/start，并从对应 thread/turn 路由流式事件。
    result: passed
    reason:
      text: 输入转换与基础流式路由通过。
      truncated: false
  - id: A20
    source: specs/codex-runtime/spec.md
    text: 同一 session 可连续多轮；每个 prompt 只由自己 turn 的 completion 结束一次。
    result: passed
    reason:
      text: 多轮 turn completion exactly-once 通过。
