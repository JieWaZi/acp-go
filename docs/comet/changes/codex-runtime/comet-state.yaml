    reason:
      text: steering 串行和单 control turn 通过。
      truncated: false
  - id: A29
    source: specs/codex-runtime/spec.md
    text: 一个 steering 的解析、发送、启动或取消失败只拒绝该请求，队列继续处理后续请求。
