    reason:
      text: 旧/跨 session completion 隔离通过。
      truncated: false
  - id: A23
    source: specs/codex-runtime/spec.md
    text: prompt 请求在 turn 启动前取消时不得留下后台 rival turn；若 turn 已活动，使用 Codex turn interrupt。
    result: failed
    reason:
      text: 取消返回后仍保留 pending RunTurn/活动槽，不能保证及时恢复后续 turn。
      truncated: false
  - id: A24
    source: specs/codex-runtime/spec.md
    text: interrupt 后等待对应 completion/cancelled 语义完成清理；重复取消幂等。
