    reason:
      text: session close 不解除尚无 turn ID 的 RunTurn 等待。
      truncated: false
  - id: A26
    source: specs/codex-runtime/spec.md
    text: 每个 session 一个 FIFO steering queue，同一时间只处理一个 steering 请求。
    result: passed
    reason:
      text: 每 session 单 consumer FIFO 通过。
      truncated: false
  - id: A27
    source: specs/codex-runtime/spec.md
    text: 有活动 turn 时发送 turn/steer；若上游返回“无活动 turn”竞态或 session 本来空闲，则按固定基线规则以 steering
      内容启动新 turn。
    result: passed
    reason:
      text: active steer/no-active start 语义通过。
      truncated: false
  - id: A28
    source: specs/codex-runtime/spec.md
    text: 并发 steering 不得启动 rival turn；请求在“注入活动 turn”或“新 turn 已被接受”后返回成功。
