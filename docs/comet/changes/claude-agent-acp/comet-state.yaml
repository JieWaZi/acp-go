  - id: A1
    source: brief.md
    text: A1：运行 `acp-agent` 或 `acp-agent --adapter codex` 的选择和 Codex
      行为保持不变；`acp-agent --adapter claude` 只构造 Claude Adapter；未知名称仍在写 ACP stdout
      前失败。
    result: passed
    reason:
      text: 组合根测试证明 Codex 仍为默认值，显式 Claude 才构造对应 Adapter，坏选择不会污染 ACP stdout。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：Claude initialize 返回名称/版本以及与 V1 一致的 image、embedded
      context、load/resume/close、additional directories、MCP HTTP/SSE 和 steering
      声明；不宣告
      auth、list/fork/delete/providers/goal/file-report/elicitation/terminal
      等未实现能力。
    result: passed
    reason:
      text: Initialize 只声明已实现的 load、resume、close、内容、目录、MCP 与 steering 能力，未宣告裁剪能力。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：Claude 可执行文件严格按 `CLAUDE_CODE_EXECUTABLE` → PATH `claude`
      解析；显式路径无效时不回退，缺失时返回可诊断错误；探测到的版本只写 stderr 诊断，不污染 ACP stdout。
    result: passed
    reason:
      text: 可执行文件解析严格执行显式路径优先且不回退，版本探测有界并只进入诊断日志。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：每个 Session 使用独立 Claude CLI，启动参数包含 `--output-format stream-json
      --verbose --input-format stream-json` 及所需配置；stdout JSONL、stderr、stdin
      写入、control request/response/cancel 和进程退出均由有界 transport 管理。
    result: passed
    reason:
      text: 每个 Session 独占 CLI 进程，JSONL/control transport 的读写、pending 与并发均有明确上限。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：非 JSON、未知消息和未知字段按固定基线记录安全摘要并兼容处理；超限帧、写失败、非零退出和信号退出产生稳定错误，保留有限 stderr
      尾部且不泄露敏感配置。
    result: passed
    reason:
      text: 坏帧、超限帧、EOF、退出、写失败和 stderr 尾部均有稳定、有界且脱敏的处理。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：new session 使用请求 cwd、additional directories、MCP 和初始配置启动进程，完成 control
      initialize 并取得稳定 Claude Session ID；并发 Session 的进程、请求和事件不会串线。
    result: passed
    reason:
      text: Session 在 control 与 system/init 双握手成功并核对 ID 后才安装，失败状态不会发布。
      truncated: false
