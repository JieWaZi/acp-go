    source: brief.md
    text: A7：resume 使用已有 Session ID 恢复但不回放历史；load 在恢复后按 upstream v0.70.0 语义回放可表达的
      user/assistant/tool 历史并过滤本地命令标记；参数变化不会复用错误的活动进程。
    result: passed
    reason:
      text: resume 不回放；load 安全定位 transcript，并按顺序回放 user、assistant、image 与 tool 内容。
      truncated: false
  - id: A8
    source: brief.md
    text: A8：同一 Session 的 prompt 按 FIFO 关联用户消息
      echo、stream/result/idle，连续多轮各自只完成一次；流先结束、结果缺失或 Session 已终止时请求不会永久悬挂。
    result: passed
    reason:
      text: 单 worker、有界 channel、echo 身份、result/idle 和 settle/drain one-shot 共同保证 FIFO
        与唯一完成。
      truncated: false
